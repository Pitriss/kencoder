name: Debian 13 - independent encoder and kencoder releases

on:
  push:
    tags:
      - 'v*'
      - 'encoder-v*'
      - 'kencoder-v*'

permissions:
  contents: read

# Never publish two independent component releases at the same time.
concurrency:
  group: kencoder-debian-releases
  queue: max
  cancel-in-progress: false

jobs:
  build-cli:
    name: encoder / ${{ matrix.arch }}
    if: startsWith(github.ref_name, 'encoder-v') || startsWith(github.ref_name, 'v')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - name: Build encoder (.deb) on Debian 13
        env:
          CI_COMPONENT: encoder
          CI_ARCH: ${{ matrix.arch }}
          CI_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform "linux/${CI_ARCH}" \
            -e CI_COMPONENT -e CI_ARCH -e CI_TAG \
            -v "$PWD:/src/kencoder" -w /src/kencoder \
            debian:trixie bash packaging/ci/build-in-container.sh
      - uses: actions/upload-artifact@v4
        with:
          name: encoder-${{ matrix.arch }}
          path: dist/encoder_*.deb
          if-no-files-found: error

  build-gui:
    name: kencoder / ${{ matrix.arch }}
    if: startsWith(github.ref_name, 'kencoder-v') || startsWith(github.ref_name, 'v')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - name: Build kencoder (.deb) on Debian 13
        env:
          CI_COMPONENT: kencoder
          CI_ARCH: ${{ matrix.arch }}
          CI_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform "linux/${CI_ARCH}" \
            -e CI_COMPONENT -e CI_ARCH -e CI_TAG \
            -v "$PWD:/src/kencoder" -w /src/kencoder \
            debian:trixie bash packaging/ci/build-in-container.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kencoder-${{ matrix.arch }}
          path: dist/kencoder_*.deb
          if-no-files-found: error

  release:
    name: Verify and publish 4 .deb packages
    needs: [build-cli, build-gui]
    if: >-
      ${{ always() && !cancelled() &&
          (needs.build-cli.result == 'success' || needs.build-cli.result == 'skipped') &&
          (needs.build-gui.result == 'success' || needs.build-gui.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download newly built CLI packages
        if: startsWith(github.ref_name, 'encoder-v') || startsWith(github.ref_name, 'v')
        uses: actions/download-artifact@v4
        with:
          pattern: encoder-*
          path: dist
          merge-multiple: true
      - name: Download newly built GUI packages
        if: startsWith(github.ref_name, 'kencoder-v') || startsWith(github.ref_name, 'v')
        uses: actions/download-artifact@v4
        with:
          pattern: kencoder-*
          path: dist
          merge-multiple: true
      - name: Reuse previous assets, verify package compatibility and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CI_TAG: ${{ github.ref_name }}
        shell: bash
        run: bash packaging/ci/publish-release.sh
